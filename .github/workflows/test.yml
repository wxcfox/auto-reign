name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run backend tests
        run: uv run pytest -v

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: auto_reign_migration_test
          MYSQL_USER: auto_reign
          MYSQL_PASSWORD: auto_reign
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=auto_reign --password=auto_reign"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run Elasticsearch Retriever integration
        env:
          ELASTICSEARCH_URL: http://127.0.0.1:9200
          RUN_ELASTICSEARCH_INTEGRATION: "1"
        run: uv run pytest -v tests/integration/test_knowledge_elasticsearch.py
      - name: Upgrade disposable MySQL schema
        env:
          DATABASE_URL: mysql+pymysql://auto_reign:auto_reign@127.0.0.1:3306/auto_reign_migration_test
        run: uv run alembic upgrade head
      - name: Run MySQL migration integration
        env:
          DATABASE_URL: mysql+pymysql://auto_reign:auto_reign@127.0.0.1:3306/auto_reign_migration_test
          MYSQL_MIGRATION_DATABASE_URL: mysql+pymysql://auto_reign:auto_reign@127.0.0.1:3306/auto_reign_migration_test
          RUN_MYSQL_INTEGRATION: "1"
        run: uv run pytest -v tests/integration/test_mysql_schema.py
      - name: Run MySQL SubtaskContext binding integration
        env:
          MYSQL_SUBTASK_CONTEXT_DATABASE_URL: mysql+pymysql://auto_reign:auto_reign@127.0.0.1:3306/auto_reign_migration_test
          RUN_MYSQL_INTEGRATION: "1"
        run: uv run pytest -v tests/integration/test_subtask_context_binding_mysql.py
      - name: Run MySQL concurrency and generation integration
        env:
          MYSQL_BOOTSTRAP_RACE_DATABASE_URL: mysql+pymysql://auto_reign:auto_reign@127.0.0.1:3306/auto_reign_migration_test
          MYSQL_RESOURCE_RACE_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/auto_reign_migration_test
          RUN_MYSQL_INTEGRATION: "1"
        run: >-
          uv run pytest -v
          tests/integration/test_bootstrap_race_mysql.py
          tests/integration/test_resource_reference_races_mysql.py
          tests/integration/test_knowledge_reference_mysql.py
          tests/integration/test_knowledge_worker_mysql.py
      - name: Run Redis stream atomicity integration
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
          RUN_REDIS_INTEGRATION: "1"
        run: uv run pytest -v tests/test_chat_stream_store.py -k real_redis
      - name: Run MySQL and Redis Task room integration
        env:
          MYSQL_MIGRATION_DATABASE_URL: mysql+pymysql://auto_reign:auto_reign@127.0.0.1:3306/auto_reign_migration_test
          REDIS_URL: redis://127.0.0.1:6379/15
          RUN_MYSQL_INTEGRATION: "1"
        run: uv run pytest -v tests/integration/test_task_room_mysql_redis.py

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**/*.[jt]s', 'frontend/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  compose:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate production Compose
        run: |
          AUTO_REIGN_ENV_FILE="$PWD/deploy/auto-reign.env.example" \
            S3_ACCESS_KEY_ID=ci-test \
            S3_SECRET_ACCESS_KEY=ci-test \
            docker compose \
              --env-file deploy/auto-reign.env.example \
              --file deploy/compose.prod.yml \
              config --quiet

  container-build:
    name: Build ${{ matrix.component }} Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: auto-reign-${{ matrix.component }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend, backend-integration, frontend, compose, container-build]
    if: always()
    steps:
      - name: Require every test job to succeed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]] || \
             [[ "${{ needs.backend-integration.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.compose.result }}" != "success" ]] || \
             [[ "${{ needs.container-build.result }}" != "success" ]]; then
            echo "One or more test jobs did not succeed." >&2
            exit 1
          fi
